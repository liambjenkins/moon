name: Build Moon Calendar

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      year:
        description: "Calendar year"
        required: true
        default: "2026"


jobs:
  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Check Skyfield eclipse support
        run: |
          python -c "from skyfield import eclipselib; print('eclipselib works')"


      - name: Generate calendar
        run: |
          PYTHONPATH=. python generate.py ${{ github.event.inputs.year || '2026' }}


      - name: Upload calendars
        uses: actions/upload-artifact@v5
        with:
          name: moon-calendars
          path: |
            Moon.ics
            Celestial.ics
