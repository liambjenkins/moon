name: Build Moon Calendar

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: true


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Generate calendars
        run: |
          PYTHONPATH=. python generate.py


      - name: Prepare Pages
        run: |
          mkdir site
          cp Moon.ics site/
          cp Celestial.ics site/
          touch site/.nojekyll


      - name: Configure Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site



  deploy:

    needs: build

    runs-on: ubuntu-latest


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
