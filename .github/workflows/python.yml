name: Moon

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Calendar year"
        required: true
        default: "2026"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate calendar
        run: |
          PYTHONPATH=. python generate.py ${{ github.event.inputs.year }}

      - name: Upload calendar
        uses: actions/upload-artifact@v5
        with:
          name: Moon-${{ github.event.inputs.year }}
          path: Moon.ics

      - name: Check Skyfield eclipse support
  run: |
    python -c "from skyfield import eclipselib; print('eclipselib works')"

